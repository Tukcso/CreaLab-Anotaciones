<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos | CreaLab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary mb-5"
        style="background-color: var(--surface-color);">

        <div class="container">

            <a class="navbar-brand fw-bold" href="#">Crea<span style="color:var(--primary-color)">Lab</span></a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active text-warning" href="#">Proyectos</a></li>
                    <li class="nav-item"><a class="nav-link" href="./inventory.html">Recursos</a></li>
                    <li class="nav-item"><a class="nav-link text-muted" href="../index.html">Salir</a></li>
                </ul>

            </div>
        </div>
    </nav>

    <main class="container">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1>Mis Proyectos</h1>

            <a href="#"
                class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center btn-pulse shadow"
                style="width: 45px; height: 45px; font-size: 24px; font-weight: bold; text-decoration: none;"
                title="Nuevo Proyecto">
                +
            </a>

        </div>

        <div class="row g-4">

            <div class="col-12 col-md-4">

                <article class="card h-100 shadow-sm card-hover bg-dark border-secondary">

                    <img src="../assets/img/pato.jpg" class="card-img-top" alt="Pato"
                        style="height: 200px; object-fit: cover; object-position: center; border-radius: 15px;">

                    <div class="card-body d-flex flex-column">

                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title text-white mb-0">La Venganza del Pato</h5>
                        </div>

                        <div class="mb-3">
                            <span class="text-white-50 small me-2">Terror</span>
                            <span class="badge bg-primary">En Producción</span>
                        </div>

                        <a href="./workspace.html" class="btn btn-primary mt-auto w-100">Entrar al Proyecto</a>

                    </div>
                </article>
            </div>

            <div class="col-12 col-md-4">

                <article class="card h-100 shadow-sm card-hover bg-dark border-secondary">

                    <img src="../assets/img/Gota.jpg" class="card-img-top" alt="Epoca"
                        style="height: 200px; object-fit: cover; object-position: top; border-radius: 15px;">

                    <div class="card-body d-flex flex-column">

                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title text-white mb-0">Una Gota de Venganza</h5>
                        </div>

                        <div class="mb-3">
                            <span class="text-white-50 small me-2">Drama</span>
                            <span class="badge bg-success">Finalizado</span>
                        </div>

                        <a href="#" class="btn btn-primary mt-auto w-100">Entrar al Proyecto</a>

                    </div>

                </article>

            </div>

            <div class="col-12 col-md-4">

                <article class="card h-100 shadow-sm card-hover bg-dark border-secondary">

                        <img src="../assets/img/Grillo.jpg" class="card-img-top" alt="GrilloElPepe"
                            style="height: 200px; object-fit: cover; object-position: top; border-radius: 15px;">

                    <div class="card-body d-flex flex-column">

                        <div class="d-flex justify-content-between align-items-start mb-2">

                            <h5 class="card-title text-white mb-0">Pepe el Grillo</h5>

                        </div>

                        <div class="mb-3">

                            <span class="text-white-50 small me-2">Documental</span>
                            <span class="badge bg-warning text-dark">Escribiendo</span>

                        </div>

                        <a href="#" class="btn btn-primary mt-auto w-100">Entrar al Proyecto</a>

                    </div>

                </article>

            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
