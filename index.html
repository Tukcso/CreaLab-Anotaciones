<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CreaLab</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>

    <main class="container vh-100 d-flex justify-content-center aling-items-center">

        <section class="card p-4 p-md-5 shadow-lg" style="width: 100%; max-width: 400px; ">

            <div class="text-center mb-4">

                <h1 class="font-size: 2rem; font-weight: bold;">Crea<span style="color: var(--primary-color)">Lab</span>
                </h1>
                <p style="color: var(--text-gray); font-size: 0.9rem">Gestión de Producción</p>

            </div>

            <form action="./pages/dashboard.html">

                <div class="mb-3">

                    <label class="form-label text-warning">Email</label>
                    <input type="email" class="form-control">

                </div>

                <div class="mb-4">

                    <label class="form-label text-warning">Contraseña</label>
                    <input type="password" class="form-control">

                </div>

                <button type="submit" class="btn btn-primary w-100">INGRESAR</button>

            </form>

            <div class="text-center mt-3">

                <a href="#" style="font-size: 0.8rem; color: #666">¿Olvidaste tu contraseña?</a>

            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
