<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CreaLab</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <main class="container">

        <section style="text-align:center; margin-top: 50px;">

            <header style="text-align:center; margin-top:50px">

                <h1 style="color: var(--text-white);">Crea<span style="color: var(--primary-color);">Lab</span></h1>
                <p style="color: var(--text-gray);"> Anotaciones de Producción</p>

            </header>    


            <div style="background-color: #1E1E1E; padding: 40px; border-radius: 10px; display: inline-block; text-align: left; margin-top: 20px;">  

                <form action="pages/dashboard.html">

                    <div style="margin-bottom: 15px;">

                        <label for="email" style="display: block; color:#AAA;">Email</label>
                        <input type="email" id="email" style="width: 100%; padding: 8px;">

                    </div>    

                    <div style="margin-bottom: 20px;">

                        <label for="contrasenia" style="display: block; color:#AAA;">Contraseña</label>
                        <input type="password" id="contrasenia" style="width: 100%; padding: 8px;">

                    </div>  

                    <button type="submit" class="btn-primary" style="width: 100%;">INGRESAR</button>

                </form>    

            </div>

        </section>

    </main>   

</body>
</html>
